<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6857d9"><meta name="description" content="PikApp — people, posts, and a separate AI workspace.">
  <title>PikApp</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" aria-label="Primary"><a class="brand" href="#home">Pik<span>App</span></a><nav class="nav" id="desktop-nav"></nav><div class="theme-box"><label for="theme">Theme</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div></aside>
    <main id="main" tabindex="-1"><header class="top"><div><p class="eyebrow">PIKAPP</p><h1 id="view-title">Home</h1></div><button id="auth-button" class="quiet">Sign in</button></header><div id="notice" role="status" aria-live="polite"></div><section id="view" aria-live="polite"></section></main>
    <aside class="rail"><section class="card"><h2>Discover</h2><p>Search people and recent conversations.</p><button data-go="explore">Open Explore</button></section><section class="card"><h2>AI stays separate</h2><p>Nothing in your social feed is sent to AI. Open AI deliberately when you want it.</p></section></aside>
  </div>
  <nav class="bottom" id="mobile-nav" aria-label="Primary"></nav>
  <dialog id="auth-dialog"><form method="dialog" class="dialog-card"><button class="close" value="cancel" aria-label="Close">×</button><h2 id="auth-title">Welcome back</h2><div id="display-wrap" hidden><label>Display name<input id="display-name" maxlength="50" autocomplete="name"></label></div><label>Username<input id="username" required minlength="3" maxlength="24" autocomplete="username"></label><div id="email-wrap" hidden><label>Email<input id="email" type="email" autocomplete="email"></label></div><label>Password<input id="password" type="password" required minlength="10" autocomplete="current-password"></label><button id="auth-submit" type="button">Sign in</button><button id="auth-switch" type="button" class="link">Need an account? Register</button></form></dialog>
  <script type="module" src="/js/app.js"></script>
</body></html>
